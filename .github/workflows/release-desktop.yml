name: Release Desktop App

# Builds the Windows Tauri app (adapter-static, see svelte.config.js) as a single portable
# .exe -- no NSIS/MSI installer, so there's nothing to install: download and run. Publishes it
# to a rolling "latest" GitHub Release (a pre-release, recreated on every push) rather than a
# versioned one, so main always has a current desktop build available.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # beforeBuildCommand (npm run build:tauri) still runs; --no-bundle only skips NSIS/MSI.
      - run: npm run tauri -- build --no-bundle

      - name: Name the portable executable
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/qrding.exe "QRding-x64-portable.exe"

      - name: Publish the rolling "latest" release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "QRding-x64-portable.exe" \
            --title "QRding (latest main build)" \
            --notes "Automatic portable build of the latest main branch ($GITHUB_SHA). Not a stable/versioned release -- download the .exe and run it, no install required." \
            --target "$GITHUB_SHA" \
            --prerelease
